name: Chef Sultan V10 AdMob Manifest Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create clean Android app
        run: flutter create --platforms=android --org com.chefsultan --project-name chef_sultan_admob_v10 admob_v10

      - name: Add Google Mobile Ads
        working-directory: admob_v10
        run: flutter pub add google_mobile_ads:9.0.0

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_kts = Path("admob_v10/android/app/build.gradle.kts")
          if gradle_kts.exists():
              s = gradle_kts.read_text()
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              gradle_kts.write_text(s)

          gradle = Path("admob_v10/android/app/build.gradle")
          if gradle.exists():
              s = gradle.read_text()
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
              gradle.write_text(s)

          p = Path("admob_v10/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET"/>'
              )

          s = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID"[\s\S]*?/>',
              '',
              s
          )

          meta = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
          '''
          s = s.replace('</application>', meta + '\n    </application>')
          p.write_text(s)
          print(s)
          PY

      - name: Write test app
        run: |
          cat > admob_v10/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const TestPage(),
              );
            }
          }

          class TestPage extends StatefulWidget {
            const TestPage({super.key});

            @override
            State<TestPage> createState() => _TestPageState();
          }

          class _TestPageState extends State<TestPage> {
            BannerAd? _banner;
            String _status = 'APP OPENED ✅\nاضغط الزر لاختبار AdMob';
            bool _busy = false;

            Future<void> _start() async {
              if (_busy) return;
              setState(() {
                _busy = true;
                _status = 'Initializing AdMob...';
              });

              try {
                await MobileAds.instance.initialize();
                final ad = BannerAd(
                  adUnitId: 'ca-app-pub-3940256099942544/6300978111',
                  size: AdSize.banner,
                  request: const AdRequest(),
                  listener: BannerAdListener(
                    onAdLoaded: (ad) {
                      if (!mounted) return;
                      setState(() {
                        _banner = ad as BannerAd;
                        _status = 'TEST AD LOADED ✅';
                        _busy = false;
                      });
                    },
                    onAdFailedToLoad: (ad, error) {
                      ad.dispose();
                      if (!mounted) return;
                      setState(() {
                        _status = 'AD LOAD FAILED: ${error.code}\n${error.message}';
                        _busy = false;
                      });
                    },
                  ),
                );
                ad.load();
                if (mounted) {
                  setState(() => _status = 'Loading Google test ad...');
                }
              } catch (e) {
                if (!mounted) return;
                setState(() {
                  _status = 'ADMOB ERROR:\n$e';
                  _busy = false;
                });
              }
            }

            @override
            void dispose() {
              _banner?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Chef Sultan • AdMob V10')),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.verified, size: 72),
                        const SizedBox(height: 20),
                        Text(_status, textAlign: TextAlign.center),
                        const SizedBox(height: 28),
                        ElevatedButton(
                          onPressed: _busy ? null : _start,
                          child: const Text('START TEST AD'),
                        ),
                        const SizedBox(height: 28),
                        if (_banner != null)
                          SizedBox(
                            width: _banner!.size.width.toDouble(),
                            height: _banner!.size.height.toDouble(),
                            child: AdWidget(ad: _banner!),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART

      - name: Get packages
        working-directory: admob_v10
        run: flutter pub get

      - name: Build APK
        working-directory: admob_v10
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chef-Sultan-V10-AdMob-Manifest-Fix-APK
          path: admob_v10/build/app/outputs/flutter-apk/app-release.apk
