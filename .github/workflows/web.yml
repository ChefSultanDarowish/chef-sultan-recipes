name: Chef Sultan V8 Free Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore stable Chef Sultan version
        run: |
          mkdir -p lib
          echo "" | base64 -d > lib/main.dart
          echo "" | base64 -d > pubspec.yaml

      - name: Add web support
        run: flutter create --platforms=web .

      - name: Get packages
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/chef-sultan-recipes/"

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
