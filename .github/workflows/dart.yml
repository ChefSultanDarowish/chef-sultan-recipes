name: Build Chef Sultan V6 AdMob Safe Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android
        run: flutter create --platforms=android .

      - name: Make AdMob startup safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_file = Path("lib/main.dart")
          text = main_file.read_text(encoding="utf-8")

          pattern = r"Future<void> main\(\) async \{\s*WidgetsFlutterBinding\.ensureInitialized\(\);\s*await MobileAds\.instance\.initialize\(\);\s*runApp\(const ChefSultanApp\(\)\);\s*\}"
          replacement = """void main() {
            WidgetsFlutterBinding.ensureInitialized();
            MobileAds.instance.initialize();
            runApp(const ChefSultanApp());
          }"""
          text = re.sub(pattern, replacement, text, count=1)
          main_file.write_text(text, encoding="utf-8")
          PY

      - name: Configure Android for safe AdMob test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          sample_app_id = "ca-app-pub-3940256099942544~3347511713"

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          if 'android.permission.INTERNET' not in text:
              pos = text.find(">")
              text = text[:pos+1] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + text[pos+1:]

          if "com.google.android.gms.ads.APPLICATION_ID" in text:
              text = re.sub(
                  r'(<meta-data\s+android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID"\s+android:value=")[^"]+(")',
                  r'\1' + sample_app_id + r'\2',
                  text,
                  flags=re.S,
              )
          else:
              meta = f"""
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="{sample_app_id}" />
              """
              text = text.replace("</application>", meta + "\n    </application>")

          manifest.write_text(text, encoding="utf-8")

          kts = Path("android/app/build.gradle.kts")
          gradle = Path("android/app/build.gradle")
          if kts.exists():
              g = kts.read_text(encoding="utf-8")
              g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              kts.write_text(g, encoding="utf-8")
          elif gradle.exists():
              g = gradle.read_text(encoding="utf-8")
              g = g.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
              g = g.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 23")
              gradle.write_text(g, encoding="utf-8")
          PY

      - name: Apply Chef Sultan icon
        run: |
          cp "assets/images/chef_sultan_app_icon (2).png" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp "assets/images/chef_sultan_app_icon (2).png" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "assets/images/chef_sultan_app_icon (2).png" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp "assets/images/chef_sultan_app_icon (2).png" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp "assets/images/chef_sultan_app_icon (2).png" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Chef-Sultan-V6-AdMob-Safe-Test-APK
          path: build/app/outputs/flutter-apk/app-release.apk
