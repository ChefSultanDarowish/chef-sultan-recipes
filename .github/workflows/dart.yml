name: Build Chef Sultan V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android
        run: flutter create --platforms=android .

      - name: Set Chef Sultan app icon
        run: |
          cp assets/images/chef_sultan_app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/images/chef_sultan_app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/images/chef_sultan_app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/images/chef_sultan_app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/images/chef_sultan_app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Chef-Sultan-V4-APK
          path: build/app/outputs/flutter-apk/app-release.apk
